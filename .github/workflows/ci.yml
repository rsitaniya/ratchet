name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest tests/ -v

  madi-engagement:
    name: madi onboarding engagement (oracle-backed)
    runs-on: ubuntu-latest
    env:
      FLYWHEEL_CONFIG: engagements/madi_onboarding/flywheel.toml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras --locked

      # The second app runs off the SAME generic loop, selected purely by config.
      - name: Build replay and start the ingest app (via the config accessor)
        run: |
          export USAGE_LOG_PATH=$(uv run python scripts/flywheel_config.py --get app.usage_log)
          echo "USAGE_LOG_PATH=$USAGE_LOG_PATH" >> "$GITHUB_ENV"
          uv run python engagements/madi_onboarding/to_replay.py --source forbes
          uv run uvicorn "$(uv run python scripts/flywheel_config.py --get app.module)" --port 8000 &
          for _ in $(seq 1 40); do curl -sf http://localhost:8000/health && break; sleep 0.25; done

      - name: Replay the new source and rank integration gaps
        run: |
          uv run python scripts/simulate.py --run-id ci-baseline
          uv run python engagements/madi_onboarding/analyze_integration.py "$USAGE_LOG_PATH" --source forbes

      # Proves the claim the whole project rests on: with FLYWHEEL_CONFIG unset,
      # flywheel_config.py falls back to defaults (no replay file declared), and
      # the simulator still discovers and exercises this real, non-trivial app's
      # endpoints from /openapi.json alone. Most synthesized requests 422 (schema-random values don't match
      # a real record) — that's expected and fine; simulate.py always exits 0
      # regardless of HTTP status, so it cannot fail this step on its own. What
      # DOES fail it: any "EXC"-tagged line (a transport failure — fire() caught
      # an exception, not a legitimate HTTP error status), or either /ingest or
      # /reconcile never actually reaching the live app under this run's traffic.
      - name: Verify zero-domain-config discovery against the live engagement app
        run: |
          OUT=$(env -u FLYWHEEL_CONFIG uv run python scripts/simulate.py http://localhost:8000 5 --run-id ci-zero-config)
          echo "$OUT"
          if echo "$OUT" | grep -q '\] EXC '; then
            echo "ERROR: a request failed at the transport level (EXC), not just a legitimate HTTP error status"
            exit 1
          fi
          for path in /ingest /reconcile; do
            if ! grep -q "\"run_id\": \"ci-zero-config\".*\"path\": \"$path\"\|\"path\": \"$path\".*\"run_id\": \"ci-zero-config\"" "$USAGE_LOG_PATH"; then
              echo "ERROR: $path never landed in usage-log telemetry for run_id=ci-zero-config"
              exit 1
            fi
          done

      # The oracle, tested as invariants — not frozen seed values. Pinning the
      # committed metrics to their seed would make a successful loop improvement
      # fail CI. Instead assert what must hold at any rule state: the already-
      # onboarded source never regresses, every metric is well-formed, and
      # converged rules beat the seed (the property the loop depends on).
      - name: Evaluate the oracle (no-regression + progression)
        run: |
          uv run python engagements/madi_onboarding/evaluate.py > /tmp/eval.json
          uv run python - <<'PY'
          import json, tempfile
          from pathlib import Path
          from engagements.madi_onboarding import evaluate as E

          e = json.load(open("/tmp/eval.json"))
          d = e["per_source"]
          # Invariant: the source already in production must never regress.
          assert d["dbpedia"]["fully_correct_rate"] == 1.0, d["dbpedia"]
          # Well-formedness: every metric present and in range, for every source.
          for src, m in d.items():
              for k in ("integrated_rate", "fully_correct_rate"):
                  assert 0.0 <= m[k] <= 1.0, (src, k, m)
          rec = e["reconcile"]
          assert {"precision", "recall", "f1"} <= set(rec["entity_matching"]), rec
          assert "accuracy" in rec["fusion"], rec

          # Progression + no cross-regression: converged reconcile rules must beat
          # the committed seed on their target metric and reach 1.0, dbpedia held.
          fx = Path("engagements/madi_onboarding/fixtures")
          tmp = Path(tempfile.mkdtemp())
          (tmp / "m.toml").write_text(
              'threshold = 0.88\nblocking_key = "country"\n'
              '[[compare]]\nfield = "name"\nsimilarity = "jaro_winkler"\nweight = 0.7\n'
              '[[compare]]\nfield = "city"\nsimilarity = "exact"\nweight = 0.3\n'
          )
          (tmp / "f.toml").write_text(
              'default_strategy = "prefer_source"\nsource_priority = ["acme_crm", "vendor_erp"]\n'
              '[attributes.revenue]\nstrategy = "prefer_source"\nsource_priority = ["vendor_erp", "acme_crm"]\n'
          )
          seed = E.evaluate_reconcile(fx)
          conv = E.evaluate_reconcile(fx, matching_rules_path=tmp / "m.toml", fusion_rules_path=tmp / "f.toml")
          assert conv["entity_matching"]["f1"] > seed["entity_matching"]["f1"], (seed, conv)
          assert conv["fusion"]["accuracy"] >= seed["fusion"]["accuracy"], (seed, conv)
          assert conv["entity_matching"]["f1"] == 1.0 and conv["fusion"]["accuracy"] == 1.0, conv
          print("oracle OK: no-regression + well-formed + converged>seed:", conv)
          PY

      # The loop must not be able to edit what scores it. The implementer's
      # output is structured {file, old_string, new_string} edits, not a diff —
      # a rename/copy/symlink attack has no equivalent in that contract, so
      # there is nothing left to craft one from; what remains to verify is that
      # an ordinary edit or create naming a protected path is still rejected,
      # and that a malformed edits file fails closed rather than defaulting open.
      - name: Protected-path guard rejects an edit or create targeting a protected path
        run: |
          set -e
          python3 -c "
          import json
          json.dump([{'file': 'engagements/madi_onboarding/evaluate.py', 'old_string': 'x', 'new_string': 'y'}], open('/tmp/edit.json', 'w'))
          json.dump([{'file': 'engagements/madi_onboarding/fixtures/new_gold.jsonl', 'old_string': '', 'new_string': 'x'}], open('/tmp/create.json', 'w'))
          "
          printf 'not valid json' > /tmp/malformed.json
          for p in /tmp/edit.json /tmp/create.json /tmp/malformed.json; do
            if uv run python scripts/check_protected_paths.py "$p"; then
              echo "ERROR: $p was NOT rejected"; exit 1
            fi
            echo "correctly rejected: $p"
          done

      # The implementer's READ boundary, exercised the way it would be attacked.
      # A guard that only rejects a direct read of a gold file is theatre: the
      # case that matters is reaching held-out material through a parent
      # directory whose own name matches no glob. Also checks it fails closed
      # with no config, rather than blessing every read because nothing resolved.
      - name: Read guard holds the implementer out of gold, fixtures, and receipts
        run: |
          set -e
          deny() {
            if echo "$2" | uv run python scripts/check_readable.py 2>/dev/null; then
              echo "ERROR: $1 was NOT denied"; exit 1
            fi
            echo "correctly denied: $1"
          }
          allow() {
            if ! echo "$2" | uv run python scripts/check_readable.py; then
              echo "ERROR: $1 was denied but must be readable"; exit 1
            fi
            echo "correctly allowed: $1"
          }
          deny "direct read of gold" \
            '{"tool_name":"Read","tool_input":{"file_path":"engagements/madi_onboarding/fixtures/gold_records.jsonl"}}'
          deny "grep of the engagement dir reaching gold sideways" \
            '{"tool_name":"Grep","tool_input":{"path":"engagements/madi_onboarding","pattern":"revenue"}}'
          deny "grep naming no path at all (the tool default: whole repo)" \
            '{"tool_name":"Grep","tool_input":{"pattern":"revenue"}}'
          deny "read of a prior cycle receipt" \
            '{"tool_name":"Read","tool_input":{"file_path":"engagements/madi_onboarding/runs/MADI_EXAMPLE.md"}}'
          allow "the adapter the implementer must edit" \
            '{"tool_name":"Read","tool_input":{"file_path":"engagements/madi_onboarding/adapters/forbes.toml"}}'
          allow "the app source it edits against" \
            '{"tool_name":"Read","tool_input":{"file_path":"engagements/madi_onboarding/app/main.py"}}'
          if echo '{"tool_name":"Read","tool_input":{"file_path":"README.md"}}' \
             | env -u FLYWHEEL_CONFIG uv run python scripts/check_readable.py 2>/dev/null; then
            echo "ERROR: read guard did not fail closed with no config"; exit 1
          fi
          echo "correctly failed closed with no config"

      # The hook above only binds the implementer if it is actually wired into
      # that agent's frontmatter. Assert the wiring, so moving the guard to
      # agent scope cannot silently become no guard at all.
      - name: Read guard is wired into the implementer subagent
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          fm = Path(".claude/agents/implementer.md").read_text().split("---")[1]
          assert "PreToolUse" in fm, "implementer.md declares no PreToolUse hook"
          assert "check_readable.py" in fm, "implementer.md does not run the read guard"
          assert "Read|Grep" in fm, "read guard is not matched to Read and Grep"
          assert "tools: Read, Grep, Glob" in fm, "implementer tool grant changed"
          settings = json.loads(Path(".claude/settings.json").read_text())
          deny = settings["permissions"]["deny"]
          assert not any("**/runs/**" in d for d in deny), (
              "runs/ is denied session-wide again — that blocks the orchestrator "
              "from showing receipts at Gate 2"
          )
          # The negative above is not enough on its own. SECURITY.md says the
          # session-wide gold/fixture deny "is the condition the committed
          # receipts were authored under" — a load-bearing claim that, until
          # this assertion existed, could be deleted with CI still green.
          for tool in ("Read", "Grep"):
              for glob in ("**/fixtures/**", "**/gold_*.json", "**/*_gold.json",
                           "**/gold_*.jsonl", "**/*_gold.jsonl"):
                  entry = f"{tool}({glob})"
                  assert entry in deny, (
                      f"{entry} is missing from .claude/settings.json deny — "
                      "SECURITY.md claims no session in this repo can read gold"
                  )
          # The VERIFICATION contract is a control, not documentation: it is what
          # makes a mapping that normalizes nothing impossible to submit without
          # the agent writing down that it is dead. A control that lives only in
          # prose can be dropped in one edit, so assert it end to end — the prompt
          # asks for it, and both skills treat an error row as a rejection.
          impl = Path(".claude/agents/implementer.md").read_text()
          assert "VERIFICATION" in impl and "LIMITS" in impl, (
              "implementer prompt no longer requires the VERIFICATION/LIMITS blocks"
          )
          assert "real value tried" in impl, "VERIFICATION no longer traces a real source value"
          for skill in (".claude/skills/dev-loop/SKILL.md",
                        ".claude/skills/dev-loop-trial/SKILL.md"):
              text = Path(skill).read_text()
              assert "VERIFICATION" in text, f"{skill} does not consume VERIFICATION"
              assert "hard stop" in text or "rejection" in text, (
                  f"{skill} does not treat a failed VERIFICATION row as a rejection"
              )
          print("read guard wired to the implementer subagent; session-wide gold deny intact; "
                "VERIFICATION contract wired end to end")
          PY

      # The committed receipts under runs/ are the evidence for the README and
      # CASE_STUDY numbers. Nothing enforced that they stay honest as the engines
      # they were computed from changed, so recompute every one from its committed
      # snapshot (adapter TOML / matching+fusion rules) and diff against the
      # committed JSON — and separately confirm every *.diff still hashes to its
      # recorded *.diff_hash.txt. A stale receipt fails CI, not a future reader.
      - name: Receipts reproduce byte-for-byte from their committed snapshots
        run: |
          uv run python - <<'PY'
          import json, tomllib
          from pathlib import Path
          from engagements.madi_onboarding import evaluate as E, adapters as A

          FX = Path("engagements/madi_onboarding/fixtures")
          ADAPTERS = Path("engagements/madi_onboarding/adapters")
          RUNS = Path("engagements/madi_onboarding/runs")
          real_load = A.load_adapter

          def score_forbes(adapter_snapshot: Path) -> dict:
              data = tomllib.loads(adapter_snapshot.read_text())

              def fake(source, adapters_dir=None):
                  if source == "forbes":
                      return {"source": "forbes", "fields": data.get("fields", {})}
                  return real_load(source, adapters_dir)

              A.load_adapter = fake
              try:
                  return {s: E.evaluate_source(s, FX, ADAPTERS) for s in ("dbpedia", "forbes")}
              finally:
                  A.load_adapter = real_load

          METRICS = ("schema_f1", "value_recall", "integrated_rate", "fully_correct_rate")
          for cycle, adapter_name in (
              ("00_baseline", "00_baseline.adapter.toml"),
              ("01_cycle1", "01_cycle1.adapter.toml"),
              ("02_cycle2", "02_cycle2.adapter.toml"),
          ):
              recomputed = score_forbes(RUNS / "forbes" / adapter_name)
              recorded = json.loads((RUNS / "forbes" / f"{cycle}.evaluate.json").read_text())["per_source"]
              for source in ("dbpedia", "forbes"):
                  for k in METRICS:
                      assert recomputed[source][k] == recorded[source][k], (
                          f"forbes/{cycle}: {source}.{k} recomputed={recomputed[source][k]} "
                          f"!= committed={recorded[source][k]}"
                      )

          for cycle, matching_snap, fusion_snap in (
              ("00_baseline", "00_baseline.matching_rules.toml", "00_baseline.fusion_rules.toml"),
              ("01_cycle1", "01_cycle1.matching_rules.toml", "00_baseline.fusion_rules.toml"),
              ("02_cycle2", "01_cycle1.matching_rules.toml", "02_cycle2.fusion_rules.toml"),
          ):
              recomputed = E.evaluate_reconcile(
                  FX,
                  matching_rules_path=RUNS / "reconcile" / matching_snap,
                  fusion_rules_path=RUNS / "reconcile" / fusion_snap,
              )
              recorded = json.loads((RUNS / "reconcile" / f"{cycle}.evaluate.json").read_text())["reconcile"]
              assert recomputed["entity_matching"]["f1"] == recorded["entity_matching"]["f1"], cycle
              assert recomputed["fusion"]["accuracy"] == recorded["fusion"]["accuracy"], cycle

          print("receipts OK: every forbes and reconcile cycle reproduces from its committed snapshot")
          PY

          for f in engagements/madi_onboarding/runs/forbes/*.diff engagements/madi_onboarding/runs/reconcile/*.diff; do
            dir=$(dirname "$f")
            cycle=$(basename "$f" | cut -d. -f1)   # e.g. "01_cycle1.adapter.diff" → "01_cycle1"
            recorded=$(cat "$dir/$cycle.diff_hash.txt")
            actual=$(git hash-object "$f")
            if [ "$recorded" != "$actual" ]; then
              echo "ERROR: $f hashes to $actual, recorded hash is $recorded"; exit 1
            fi
          done
          echo "diff hashes OK: every runs/*.diff matches its committed *.diff_hash.txt"

      # Delivery telemetry, end to end. The economics claim rests on this file
      # being written correctly by the skills, so drive one full cycle's worth of
      # marks and assert the derived record — not just the unit tests.
      - name: Cycle log records a full cycle and derives its economics
        run: |
          set -e
          uv run python scripts/cycle_log.py start --cycle 1 --gates human
          for phase in simulate analyze gate1 implement apply implement apply test evaluate gate2; do
            uv run python scripts/cycle_log.py mark "$phase"
          done
          printf '[{"file":"a.toml","old_string":"x","new_string":"yy"}]' > /tmp/edits.json
          uv run python scripts/cycle_log.py finish --outcome kept --edits /tmp/edits.json
          uv run python scripts/cycle_log.py report
          uv run python - <<'PY'
          import json, os, subprocess
          log = subprocess.run(
              ["uv", "run", "python", "scripts/flywheel_config.py", "--get", "app.cycle_log"],
              capture_output=True, text=True, check=True).stdout.strip()
          rec = json.loads(open(log).read().splitlines()[-1])
          assert rec["outcome"] == "kept", rec
          assert rec["resubmissions"] == 1, rec        # two `implement` marks = one retry
          assert rec["files"] == 1 and rec["edits"] == 1, rec
          assert rec["control_stop"] is False, rec
          assert set(rec["seconds"]) >= {"gate1", "gate2", "implement"}, rec
          gates = rec["seconds"]["gate1"] + rec["seconds"]["gate2"]
          assert "human_seconds" not in rec, "human decision time is not measurable here — see cycle_log.py"
          assert abs(rec["agent_seconds"] - (rec["total_seconds"] - gates)) < 0.05, rec
          os.remove(log)                               # CI must not commit a synthetic cycle
          print("cycle log OK:", rec["total_seconds"], "s")
          PY

      # Rule 24 applied to the headline numbers, not just the receipts. Two
      # mechanisms, because the docs hold these figures in two different shapes.
      # CASE_STUDY's table is GENERATED from cycles.jsonl, so it cannot drift at
      # all -- no substring matching, no retyped figure. README states the same
      # numbers inside prose that cannot be generated without mangling it, so
      # there each line naming a figure must carry the right one. An earlier
      # version of this step just searched the docs for the substring "3", which
      # matches almost any sentence and proved nothing.
      - name: Delivery economics in the docs match the committed cycle records
        run: |
          uv run python scripts/render_delivery_table.py \
            engagements/madi_onboarding/CASE_STUDY.md \
            --log engagements/madi_onboarding/runs/delivery/cycles.jsonl --check
          uv run python - <<'PY'
          import json, re, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from cycle_log import summarize

          log = Path("engagements/madi_onboarding/runs/delivery/cycles.jsonl")
          records = [json.loads(l) for l in log.read_text().splitlines() if l.strip()]
          s = summarize(records)
          f1 = [r["metrics"]["fullcontact.schema_f1"] for r in records]

          # (what the line is about, the only value it may quote). A label with no
          # figure on its line is a legend and exempt; a label WITH a figure is
          # making the claim and must make the right one.
          LABELLED = (
              ("agent minutes",  re.compile(r"agent\s+min(?:ute)?s?", re.I),
               str(s["agent_minutes_per_accepted"])),
              ("wall minutes",   re.compile(r"wall\s+min(?:ute)?s?", re.I),
               str(s["wall_minutes_per_accepted"])),
              ("schema_f1 path", re.compile(r"schema_f1`?\s*`?[\d.]+\s*→", re.I),
               " → ".join([f"{f1[0]['before']:.2f}"] + [f"{m['after']:.2f}" for m in f1])),
          )
          has_figure = re.compile(r"\d+\.\d+")
          doc = Path("README.md")
          text = doc.read_text()

          problems = []
          for name, label, value in LABELLED:
              if not label.search(text):
                  problems.append(f"README no longer states {name} at all (expected {value!r})")
                  continue
              for n, line in enumerate(text.splitlines(), 1):
                  if label.search(line) and has_figure.search(line) and value not in line:
                      problems.append(f"README:{n} quotes a figure for {name} that is not {value!r}")

          # The gate spans contain orchestrator work as well as an operator, so no
          # human-time figure is derivable here. Catch a *claim*, not a discussion
          # of why the number is absent.
          claim = re.compile(r"human\s+min(?:ute)?s?\s*(?:/|per)\b", re.I)
          for d in (doc, Path("engagements/madi_onboarding/CASE_STUDY.md")):
              hit = claim.search(d.read_text())
              if hit:
                  problems.append(f"{d} states a human-time figure ({hit.group(0)!r})")

          if problems:
              print("ERROR: published economics do not match the committed records:")
              for p in problems:
                  print("  " + p)
              print("Run: uv run python scripts/cycle_log.py report --log " + str(log))
              raise SystemExit(1)
          print("README economics OK; CASE_STUDY table generated and current")
          PY

      # Reproducibility check: the pinned downloader fetches the real MaDI data and
      # verifies git blob SHAs. Non-fatal so external availability never reds CI.
      - name: Verify pinned downloader (network, non-fatal)
        continue-on-error: true
        run: uv run python engagements/madi_onboarding/download_data.py
