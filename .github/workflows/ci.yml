name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest tests/ -v

  madi-engagement:
    name: madi onboarding engagement (oracle-backed)
    runs-on: ubuntu-latest
    env:
      FLYWHEEL_CONFIG: engagements/madi_onboarding/flywheel.toml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras --locked

      # The second app runs off the SAME generic loop, selected purely by config.
      - name: Build replay and start the ingest app (via the config accessor)
        run: |
          export USAGE_LOG_PATH=$(uv run python scripts/flywheel_config.py --get app.usage_log)
          echo "USAGE_LOG_PATH=$USAGE_LOG_PATH" >> "$GITHUB_ENV"
          uv run python engagements/madi_onboarding/to_replay.py --source forbes
          uv run uvicorn "$(uv run python scripts/flywheel_config.py --get app.module)" --port 8000 &
          for _ in $(seq 1 40); do curl -sf http://localhost:8000/health && break; sleep 0.25; done

      - name: Replay the new source and rank integration gaps
        run: |
          uv run python scripts/simulate.py --run-id ci-baseline
          uv run python engagements/madi_onboarding/analyze_integration.py "$USAGE_LOG_PATH" --source forbes

      # Proves the claim the whole project rests on: with FLYWHEEL_CONFIG unset,
      # flywheel_config.py falls back to defaults (no replay file declared), and
      # the simulator still discovers and exercises this real, non-trivial app's
      # endpoints from /openapi.json alone. Most synthesized requests 422 (schema-random values don't match
      # a real record) — that's expected and fine; simulate.py always exits 0
      # regardless of HTTP status, so it cannot fail this step on its own. What
      # DOES fail it: any "EXC"-tagged line (a transport failure — fire() caught
      # an exception, not a legitimate HTTP error status), or either /ingest or
      # /reconcile never actually reaching the live app under this run's traffic.
      - name: Verify zero-domain-config discovery against the live engagement app
        run: |
          OUT=$(env -u FLYWHEEL_CONFIG uv run python scripts/simulate.py http://localhost:8000 5 --run-id ci-zero-config)
          echo "$OUT"
          if echo "$OUT" | grep -q '\] EXC '; then
            echo "ERROR: a request failed at the transport level (EXC), not just a legitimate HTTP error status"
            exit 1
          fi
          for path in /ingest /reconcile; do
            if ! grep -q "\"run_id\": \"ci-zero-config\".*\"path\": \"$path\"\|\"path\": \"$path\".*\"run_id\": \"ci-zero-config\"" "$USAGE_LOG_PATH"; then
              echo "ERROR: $path never landed in usage-log telemetry for run_id=ci-zero-config"
              exit 1
            fi
          done

      # The oracle, tested as invariants — not frozen seed values. Pinning the
      # committed metrics to their seed would make a successful loop improvement
      # fail CI. Instead assert what must hold at any rule state: the already-
      # onboarded source never regresses, every metric is well-formed, and
      # converged rules beat the seed (the property the loop depends on).
      - name: Evaluate the oracle (no-regression + progression)
        run: |
          uv run python engagements/madi_onboarding/evaluate.py > /tmp/eval.json
          uv run python - <<'PY'
          import json, tempfile
          from pathlib import Path
          from engagements.madi_onboarding import evaluate as E

          e = json.load(open("/tmp/eval.json"))
          d = e["per_source"]
          # Invariant: the source already in production must never regress.
          assert d["dbpedia"]["fully_correct_rate"] == 1.0, d["dbpedia"]
          # Well-formedness: every metric present and in range, for every source.
          for src, m in d.items():
              for k in ("integrated_rate", "fully_correct_rate"):
                  assert 0.0 <= m[k] <= 1.0, (src, k, m)
          rec = e["reconcile"]
          assert {"precision", "recall", "f1"} <= set(rec["entity_matching"]), rec
          assert "accuracy" in rec["fusion"], rec

          # Progression + no cross-regression: converged reconcile rules must beat
          # the committed seed on their target metric and reach 1.0, dbpedia held.
          fx = Path("engagements/madi_onboarding/fixtures")
          tmp = Path(tempfile.mkdtemp())
          (tmp / "m.toml").write_text(
              'threshold = 0.88\nblocking_key = "country"\n'
              '[[compare]]\nfield = "name"\nsimilarity = "jaro_winkler"\nweight = 0.7\n'
              '[[compare]]\nfield = "city"\nsimilarity = "exact"\nweight = 0.3\n'
          )
          (tmp / "f.toml").write_text(
              'default_strategy = "prefer_source"\nsource_priority = ["acme_crm", "vendor_erp"]\n'
              '[attributes.revenue]\nstrategy = "prefer_source"\nsource_priority = ["vendor_erp", "acme_crm"]\n'
          )
          seed = E.evaluate_reconcile(fx)
          conv = E.evaluate_reconcile(fx, matching_rules_path=tmp / "m.toml", fusion_rules_path=tmp / "f.toml")
          assert conv["entity_matching"]["f1"] > seed["entity_matching"]["f1"], (seed, conv)
          assert conv["fusion"]["accuracy"] >= seed["fusion"]["accuracy"], (seed, conv)
          assert conv["entity_matching"]["f1"] == 1.0 and conv["fusion"]["accuracy"] == 1.0, conv
          print("oracle OK: no-regression + well-formed + converged>seed:", conv)
          PY

      # The loop must not be able to edit what scores it — including via a
      # quoted/escaped path that fools a naive text parser but not `git apply`,
      # or a symlink into a protected dir that a follow-up patch writes through.
      - name: Protected-path guard rejects plain, escaped, and symlink evaluator edits
        run: |
          set -e
          printf 'diff --git a/engagements/madi_onboarding/evaluate.py b/engagements/madi_onboarding/evaluate.py\n--- a/engagements/madi_onboarding/evaluate.py\n+++ b/engagements/madi_onboarding/evaluate.py\n@@ -1 +1 @@\n-x\n+y\n' > /tmp/plain.patch
          printf 'diff --git "a/engagements/madi_onboarding/\\145valuate.py" "b/engagements/madi_onboarding/\\145valuate.py"\n--- "a/engagements/madi_onboarding/\\145valuate.py"\n+++ "b/engagements/madi_onboarding/\\145valuate.py"\n@@ -0,0 +1 @@\n+x\n' > /tmp/escaped.patch
          printf 'diff --git a/shim b/shim\nnew file mode 120000\nindex 0000000..d488960\n--- /dev/null\n+++ b/shim\n@@ -0,0 +1 @@\n+engagements/madi_onboarding/fixtures\n' > /tmp/symlink.patch
          for p in /tmp/plain.patch /tmp/escaped.patch /tmp/symlink.patch; do
            if uv run python scripts/check_protected_paths.py "$p"; then
              echo "ERROR: $p was NOT rejected"; exit 1
            fi
            echo "correctly rejected: $p"
          done

      # The committed receipts under runs/ are the evidence for the README and
      # CASE_STUDY numbers. Nothing enforced that they stay honest as the engines
      # they were computed from changed, so recompute every one from its committed
      # snapshot (adapter TOML / matching+fusion rules) and diff against the
      # committed JSON — and separately confirm every *.diff still hashes to its
      # recorded *.diff_hash.txt. A stale receipt fails CI, not a future reader.
      - name: Receipts reproduce byte-for-byte from their committed snapshots
        run: |
          uv run python - <<'PY'
          import json, tomllib
          from pathlib import Path
          from engagements.madi_onboarding import evaluate as E, adapters as A

          FX = Path("engagements/madi_onboarding/fixtures")
          ADAPTERS = Path("engagements/madi_onboarding/adapters")
          RUNS = Path("engagements/madi_onboarding/runs")
          real_load = A.load_adapter

          def score_forbes(adapter_snapshot: Path) -> dict:
              data = tomllib.loads(adapter_snapshot.read_text())

              def fake(source, adapters_dir=None):
                  if source == "forbes":
                      return {"source": "forbes", "fields": data.get("fields", {})}
                  return real_load(source, adapters_dir)

              A.load_adapter = fake
              try:
                  return {s: E.evaluate_source(s, FX, ADAPTERS) for s in ("dbpedia", "forbes")}
              finally:
                  A.load_adapter = real_load

          METRICS = ("schema_f1", "value_recall", "integrated_rate", "fully_correct_rate")
          for cycle, adapter_name in (
              ("00_baseline", "00_baseline.adapter.toml"),
              ("01_cycle1", "01_cycle1.adapter.toml"),
              ("02_cycle2", "02_cycle2.adapter.toml"),
          ):
              recomputed = score_forbes(RUNS / "forbes" / adapter_name)
              recorded = json.loads((RUNS / "forbes" / f"{cycle}.evaluate.json").read_text())["per_source"]
              for source in ("dbpedia", "forbes"):
                  for k in METRICS:
                      assert recomputed[source][k] == recorded[source][k], (
                          f"forbes/{cycle}: {source}.{k} recomputed={recomputed[source][k]} "
                          f"!= committed={recorded[source][k]}"
                      )

          for cycle, matching_snap, fusion_snap in (
              ("00_baseline", "00_baseline.matching_rules.toml", "00_baseline.fusion_rules.toml"),
              ("01_cycle1", "01_cycle1.matching_rules.toml", "00_baseline.fusion_rules.toml"),
              ("02_cycle2", "01_cycle1.matching_rules.toml", "02_cycle2.fusion_rules.toml"),
          ):
              recomputed = E.evaluate_reconcile(
                  FX,
                  matching_rules_path=RUNS / "reconcile" / matching_snap,
                  fusion_rules_path=RUNS / "reconcile" / fusion_snap,
              )
              recorded = json.loads((RUNS / "reconcile" / f"{cycle}.evaluate.json").read_text())["reconcile"]
              assert recomputed["entity_matching"]["f1"] == recorded["entity_matching"]["f1"], cycle
              assert recomputed["fusion"]["accuracy"] == recorded["fusion"]["accuracy"], cycle

          print("receipts OK: every forbes and reconcile cycle reproduces from its committed snapshot")
          PY

          for f in engagements/madi_onboarding/runs/forbes/*.diff engagements/madi_onboarding/runs/reconcile/*.diff; do
            dir=$(dirname "$f")
            cycle=$(basename "$f" | cut -d. -f1)   # e.g. "01_cycle1.adapter.diff" → "01_cycle1"
            recorded=$(cat "$dir/$cycle.diff_hash.txt")
            actual=$(git hash-object "$f")
            if [ "$recorded" != "$actual" ]; then
              echo "ERROR: $f hashes to $actual, recorded hash is $recorded"; exit 1
            fi
          done
          echo "diff hashes OK: every runs/*.diff matches its committed *.diff_hash.txt"

      # Reproducibility check: the pinned downloader fetches the real MaDI data and
      # verifies git blob SHAs. Non-fatal so external availability never reds CI.
      - name: Verify pinned downloader (network, non-fatal)
        continue-on-error: true
        run: uv run python engagements/madi_onboarding/download_data.py
