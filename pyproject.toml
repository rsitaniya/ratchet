[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-flywheel"
version = "0.5.0"
description = "A FastAPI service that ships its own features from its own usage data — a closed, agentic development loop."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Rohan Sitaniya" }]
keywords = ["agentic-ai", "llm", "claude-code", "fastapi", "developer-tools", "ai-agents"]
classifiers = [
    # No License classifier: superseded by the PEP 639 `license` expression above.
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "watchfiles>=0.21.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/rsitaniya/dev-flywheel"
Repository = "https://github.com/rsitaniya/dev-flywheel"
Changelog = "https://github.com/rsitaniya/dev-flywheel/blob/main/CHANGELOG.md"

[tool.setuptools]
# Importable packages: the example calculator app, plus engagement packages so
# their scripts (evaluate.py, analyze_integration.py) import `engagements.*`
# regardless of the working directory. scripts/ are run directly, not imported.
packages = ["app", "engagements", "engagements.madi_onboarding", "engagements.madi_onboarding.app"]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = [
    # FastAPI's core idiom is calling Query()/Depends() in argument defaults.
    "B008",
    # `class Operation(str, Enum)` is deliberate: it keeps JSON-schema enum
    # serialization identical across the FastAPI versions this supports.
    "UP042",
]
