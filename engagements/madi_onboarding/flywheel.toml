# Engagement config: points the generic loop at the partner-onboarding app.
# Selected by exporting FLYWHEEL_CONFIG=engagements/madi_onboarding/flywheel.toml.
# Path-valued keys resolve against THIS file's directory (see scripts/flywheel_config.py).

[app]
module = "engagements.madi_onboarding.app.main:app"
base_url = "http://localhost:8000"
usage_log = "usage_log.jsonl"                      # → engagements/madi_onboarding/usage_log.jsonl
# The held-out oracle the dev-loop runs at Gate 2 to score a proposed adapter.
evaluator = "python engagements/madi_onboarding/evaluate.py"
# The domain gap-ranker the dev-loop runs to build STEP 2's proposal signal
# (the orchestrator appends the usage-log path). This is what wires the engagement
# analyzer into the loop.
analyzer = "python engagements/madi_onboarding/analyze_integration.py --source forbes"

[protected]
# The implementer patch may never touch these — the evaluator, the mapping
# engine it runs, the gold labels, the fixtures, or the source data. Editing
# what measures you is not a fix. (Adapters under adapters/*.toml and new
# normalizers ARE writable: a broken normalizer can only lower the score, and
# gold is unreachable, so those can't inflate the metric.)
paths = [
    "**/evaluate.py",
    "**/adapters.py", "**/matching.py", "**/fusion.py",   # the engines the evaluator runs
    "**/similarity.py",                                    # matching.py's own scoring functions — same reason
    "**/fixtures/**",                                       # sources + gold (records, pairs, fused)
    "**/gold_*.json", "**/*_gold.json",
    "**/gold_*.jsonl", "**/*_gold.jsonl",                  # this repo's actual gold files are .jsonl
    "**/flywheel.toml",                                    # this file: declares the evaluator and this very list
    "scripts/**",                                          # the loop's own machinery (guard, config loader, simulator)
    ".claude/**",                                          # the orchestrator skills and agent definitions
]

# What the implementer may never READ — a narrower list than `paths` above, and
# enforced somewhere else entirely: check_readable.py, wired as a PreToolUse hook
# in .claude/agents/implementer.md, so it binds that one subagent rather than the
# whole session. The implementer still reads adapters.py, the app source, and the
# ranked gap report; it never sees gold, the source records gold was derived from,
# or a prior cycle's converged answer under runs/.
unreadable = [
    "**/fixtures/**",                                      # sources + gold (records, pairs, fused)
    "**/gold_*.json", "**/*_gold.json",
    "**/gold_*.jsonl", "**/*_gold.jsonl",
    "**/runs/**",                                          # committed receipts, including converged adapters
]

[simulator]
default_requests = 30

[traffic]
# The new source's records, replayed as POST /ingest calls (build with to_replay.py).
replay_file = "replay_forbes.jsonl"                # → engagements/madi_onboarding/replay_forbes.jsonl
