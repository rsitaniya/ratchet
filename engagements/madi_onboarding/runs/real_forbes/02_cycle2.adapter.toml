# The real-data test split's forbes adapter. Starts with NO field mappings, same
# as adapters/forbes.toml's synthetic counterpart — the fitted synthetic adapter
# cannot transfer (real forbes columns share nothing with the synthetic ones), so
# this is a genuine held-out distribution, not a subsample. The loop fills this
# file in; evaluate.py scores it against gold_mapping.json under data/madi/.
source = "forbes"

[fields]

# Columns are anonymized elsewhere in this repo, but forbes' own column names
# already describe the values; checked across all 2000 records, none empty.

# company is the firm's name on every record ("ICBC", "JPMorgan Chase", ...).
[fields.company]
target = "name"
normalizer = "identity"

# asset_value is a plain numeric string, no currency symbol or magnitude suffix
# ("3124900000000"); currency_to_usd's plain-number path parses it directly.
[fields.asset_value]
target = "assets"
normalizer = "currency_to_usd"

# sales_figure is the same plain numeric shape ("148700000000").
[fields.sales_figure]
target = "revenue"
normalizer = "currency_to_usd"

# id comes from forbes_url, not record_id. record_id is pipeline metadata:
# to_replay.py synthesizes it under that literal key only for live /ingest
# traffic, and apply_adapter() skips that key unconditionally — but it is
# never present on the raw source rows the held-out evaluator scores, so it
# was never a candidate for id in the first place. forbes_url is: a URL like
# "http://www.forbes.com/companies/icbc/", unique per company, present on all
# 2000 real records — identity passes it through as-is.
[fields.forbes_url]
target = "id"
normalizer = "identity"
