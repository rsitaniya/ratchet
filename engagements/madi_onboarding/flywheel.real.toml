# Real-data TEST split of the same engagement: scores adapters against MaDI-Bench's
# own CSVs and its own schema-matching gold (sm_mapping_gold.json), instead of the
# synthetic fixtures/ used every dev cycle (flywheel.toml). Selected the same way:
#   export FLYWHEEL_CONFIG=engagements/madi_onboarding/flywheel.real.toml
#
# Preconditions (run once, from repo root):
#   uv run python engagements/madi_onboarding/download_data.py
#   uv run python engagements/madi_onboarding/csv_to_ingest.py --source forbes
#   uv run python engagements/madi_onboarding/prepare_real_eval.py
#
# Only sm_mapping_gold.json is pinned for the real benchmark — no normalized-value
# gold — so this split only scores schema_f1 and integrated_rate; value_recall and
# fully_correct_rate report null (see evaluate.py, prepare_real_eval.py).

[app]
module = "engagements.madi_onboarding.app.main:app"
base_url = "http://localhost:8000"
usage_log = "usage_log_real.jsonl"                 # → engagements/madi_onboarding/usage_log_real.jsonl
target_schema = "data/madi/target_schema.json"     # real MaDI target schema, not the synthetic one
adapters_dir = "adapters_real"                     # separate write surface — starts empty, like adapters/forbes.toml
evaluator = "python engagements/madi_onboarding/evaluate.py --fixtures engagements/madi_onboarding/data/madi --adapters engagements/madi_onboarding/adapters_real --sources forbes"
analyzer = "python engagements/madi_onboarding/analyze_integration.py --source forbes"

[protected]
# Same reasons as flywheel.toml, plus the two real-data-specific paths: the script
# that legitimately reads real gold, and its output (which also already matches
# the **/gold_*.json / **/*_gold.json globs below).
paths = [
    "**/evaluate.py",
    "**/adapters.py", "**/matching.py", "**/fusion.py",
    "**/similarity.py",
    "**/fixtures/**",
    "**/gold_*.json", "**/*_gold.json",
    "**/gold_*.jsonl", "**/*_gold.jsonl",
    "**/flywheel.toml", "**/flywheel.real.toml",
    "scripts/**",
    ".claude/**",
    "**/prepare_real_eval.py",
    "**/data/madi/**",
]

[simulator]
default_requests = 30

[traffic]
replay_file = "replay_real_forbes.jsonl"           # → engagements/madi_onboarding/replay_real_forbes.jsonl
